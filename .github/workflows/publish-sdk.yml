# Publish @neuronruntime/sdk to npm.
#
# Authentication uses an npm automation/granular access token stored as a
# GitHub Actions secret in the `release` environment. The workflow also
# publishes with --provenance (id-token: write), so the npm registry records a
# signed GitHub-backed attestation for every release.
#
# One-time setup (required):
#   1. Create an npm automation or granular access token with publish rights
#      for the @neuronruntime scope: https://www.npmjs.com/settings → Access Tokens.
#   2. In the GitHub repository: Settings → Environments → New environment
#      named `release`.
#   3. Under the `release` environment's secrets, add `NPM_TOKEN`
#      holding the token from step 1.
#
# Release: push a tag named sdk-v<semver>, e.g. `git tag sdk-v0.1.0 && git push
# origin sdk-v0.1.0`. The tag version overrides package.json before publishing.

name: Publish TypeScript SDK

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @neuronruntime/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # --provenance is supported from npm >= 9.5; use the latest.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @neuronruntime/sdk build

      - name: Set version from tag
        working-directory: packages/assembly-sdks/typescript
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#sdk-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "tag ${GITHUB_REF_NAME} does not map to a valid semver version (${version})" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      # npm refuses to publish a prerelease to the default `latest` tag.
      # Prerelease tags (e.g. sdk-v0.1.0-pre-alpha) go to `next`; a stable tag
      # (e.g. sdk-v0.1.0) publishes as `latest`.
      - name: Publish
        working-directory: packages/assembly-sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          args=(--access public --provenance --ignore-scripts)
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            args+=(--tag next)
          fi
          npm publish "${args[@]}"
