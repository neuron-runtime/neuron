# Publish the Neuron.Executor .NET SDK to NuGet.
#
# Authentication uses a NuGet API key stored as a GitHub Actions secret in the
# `release` environment. The key is scoped to the Neuron.Executor package with
# push-only rights.
#
# One-time setup (required):
#   1. Create an API key on nuget.org: https://www.nuget.org → API keys →
#      Generate Key. Scope it to the Neuron.Executor package with Push rights,
#      and set an expiration you are willing to rotate.
#   2. In the GitHub repository: Settings → Environments → New environment
#      named `release` (shared with the npm publish workflow).
#   3. Under the `release` environment's secrets, add `NUGET_API_KEY`
#      holding the key from step 1.
#
# Release: push a tag named dotnet-v<semver>, e.g.
#   `git tag dotnet-v0.1.0 && git push origin dotnet-v0.1.0`.

name: Publish .NET Executor SDK

on:
  push:
    tags:
      - "dotnet-v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Neuron.Executor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: packages/executor-sdks/dotnet/**/*.csproj

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#dotnet-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "tag ${GITHUB_REF_NAME} does not map to a valid semver version (${version})" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore packages/executor-sdks/dotnet/Neuron.Executor.slnx

      - name: Build
        run: >-
          dotnet build packages/executor-sdks/dotnet/Neuron.Executor.slnx
          -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: >-
          dotnet test packages/executor-sdks/dotnet/Neuron.Executor.slnx
          -c Release --no-build -p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: >-
          dotnet pack packages/executor-sdks/dotnet/src/Neuron.Executor/Neuron.Executor.csproj
          -c Release --no-build -p:Version=${{ steps.version.outputs.value }}
          -o "${{ runner.temp }}/pack"

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "${{ runner.temp }}/pack/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
