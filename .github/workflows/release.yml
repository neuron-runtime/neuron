name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Build and package all release targets
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/release.sh --version "$VERSION" --out "$RUNNER_TEMP/dist"

      - name: Publish GitHub release
        env:
          VERSION: ${{ github.ref_name }}
          # gh reads GH_TOKEN; without it `gh release create` fails the
          # authentication check even though contents: write is granted.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          dist_dir="$RUNNER_TEMP/dist/$VERSION"
          gh release create "$VERSION" \
            "$dist_dir"/neuron-"${VERSION}"-* \
            "$dist_dir/SHA256SUMS" \
            --title "Neuron ${VERSION#v}" \
            --generate-notes