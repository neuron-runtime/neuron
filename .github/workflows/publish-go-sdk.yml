# Publish the Go modules via tags.
#
# Go has no package registry upload step: a module is published by pushing a
# git tag whose prefix matches the module path. No credentials are involved.
#
#   shared module              -> tag shared/v<semver>
#   executor SDK (golang)      -> tag packages/executor-sdks/golang/v<semver>
#
# This workflow validates the tagged module (format, vet, test, build) and
# verifies the tag prefix matches the module path, so a mistyped tag cannot
# silently declare a module version. The proxy will serve the tag once CI is
# green.
#
# The executor SDK depends on the shared module, and consumers ignore a
# module's `replace` directives. Until the shared module is published, its
# go.mod carries a local `replace` for development; the workflow therefore
# refuses to publish the executor SDK while that replace (or the matching
# placeholder version) is present. The required sequence is:
#
#   1. git tag shared/v0.1.0 && git push origin shared/v0.1.0
#   2. merge the commit that removes the replace from
#      packages/executor-sdks/golang/go.mod and pins the published
#      github.com/neuron-runtime/neuron/shared version
#   3. git tag packages/executor-sdks/golang/v0.1.0 && git push origin
#      packages/executor-sdks/golang/v0.1.0
#
# Release:
#   git tag shared/v0.2.0 && git push origin shared/v0.2.0
#   git tag packages/executor-sdks/golang/v0.2.0 && git push origin packages/executor-sdks/golang/v0.2.0

name: Publish Go SDK

on:
  push:
    tags:
      - "shared/v*"
      - "packages/executor-sdks/golang/v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tagged Go module
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Resolve module and version from tag
        id: module
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            shared/v*)
              module="./shared/..."
              path="shared"
              prefix="shared/v"
              ;;
            packages/executor-sdks/golang/v*)
              module="./packages/executor-sdks/golang/..."
              path="packages/executor-sdks/golang"
              prefix="packages/executor-sdks/golang/v"
              ;;
            *)
              echo "unexpected tag ${tag}" >&2
              exit 1
              ;;
          esac
          version="${tag#"$prefix"}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "tag ${tag} does not map to a valid semver version (${version})" >&2
            exit 1
          fi
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Consumers ignore a module's `replace` directives, so the executor SDK
      # is only publishable once its local shared replace is removed in favor
      # of the published version. Tagging early would ship a module that
      # cannot build for anyone outside this workspace — fail loudly instead.
      - name: Publishable module check (executor SDK)
        if: steps.module.outputs.path == 'packages/executor-sdks/golang'
        shell: bash
        run: |
          go_mod="packages/executor-sdks/golang/go.mod"
          if grep -qE '^[[:space:]]*replace[[:space:]]' "$go_mod" || grep -q 'v0.0.0-00010101000000-000000000000' "$go_mod"; then
            echo "$go_mod still contains a replace directive or placeholder version." >&2
            echo "Consumers ignore replace directives. Publish shared first:" >&2
            echo "  1. tag and push shared/vX" >&2
            echo "  2. merge the commit removing the replace and pinning the published shared version" >&2
            echo "  3. tag and push packages/executor-sdks/golang/vX" >&2
            exit 1
          fi

      - name: Formatting
        run: |
          files="$(gofmt -l "${{ steps.module.outputs.path }}")"
          if [ -n "$files" ]; then
            echo "gofmt required on:"; echo "$files"; exit 1
          fi

      - name: Vet
        run: go vet ${{ steps.module.outputs.module }}

      - name: Test
        run: go test ${{ steps.module.outputs.module }}

      - name: Build
        run: go build ${{ steps.module.outputs.module }}

      - name: Summary
        run: |
          echo "### Published ${{ steps.module.outputs.path }} v${{ steps.module.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The Go module proxy will serve this tag: \`https://proxy.golang.org/github.com/neuron-runtime/neuron/${{ steps.module.outputs.path }}/@v/v${{ steps.module.outputs.version }}.info\`" >> "$GITHUB_STEP_SUMMARY"
