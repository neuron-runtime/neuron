  - id: T-024
    objective: "Implement durable wait state, scheduler-owned wait transitions, recovery, deadlines, and snapshot v3"
    scope:
      - "nore/internal/execution/execution.go"
      - "nore/internal/execution/snapshot.go"
      - "nore/internal/execution/accessors.go"
      - "nore/internal/execution/wait.go"
      - "nore/internal/execution/store.go"
      - "nore/internal/execution/dispatch_intent*.go"
      - "nore/internal/execution/recovery*.go"
      - "nore/internal/execution/scheduler/**"
      - "nore/internal/execution/*_test.go"
      - "nore/internal/instance/**"
      - "nore/internal/contracts/**"
      - "nore/internal/event/**"
      - "nore/internal/mechanism/**"
    owner: coder
    reviewer: reviewer
    signoff: [architect, security]
    dependencies: [T-021, T-022, T-023]
    acceptance:
      - "A capability can enter CapabilityWaiting with reason, correlation key, expected signal/timer, WaitUntil, and payload schema"
      - "Wait entry is committed transactionally with timer/state; no waiting execution has missing wait metadata"
      - "WaitUntil == nil is never treated as due; elapsed timer/deadline waits resume; signal waits without deadline stay waiting"
      - "Waiting capabilities are excluded from inFlight/worker accounting"
      - "StatusWaiting is derived only when no runnable work remains"
      - "Signal and timer resolution commit state, delete the timer, persist the delivery record when applicable, and create the dispatch intent before publishing"
      - "Cancellation is terminal, deletes timers, discards buffered join inputs, and retains wait metadata for diagnostics"
      - "Wait deadline policy fail/cancel/continue is applied transactionally with a recorded reason; execution max lifetime is separate from capability timeout"
      - "Durable retry writes CapabilityRetryWait/NextAttemptAt and releases the worker; non-durable behavior is unchanged"
      - "Snapshot schema v3 adds execution deadline; v1/v2/v3 decode correctly"
      - "Recovery restores retry timers and suspended waits; completed capabilities are never rerun; join state is restored"
