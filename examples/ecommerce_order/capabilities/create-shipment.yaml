apiVersion: neuron/v1
kind: Capability

metadata:
  name: create-shipment
  version: 1.0.0
  description: Create shipment

spec:
  capability runtime:
    type: neuron:core:set

  config:
    shipment:
      tracking_number: "1Z999AA10123456784"
      carrier: UPS
      label_url: "https://shipping.example.com/label/1Z999AA10123456784"

  mappings:
    - direction: input
      source: order
      target: order
    - direction: input
      source: shipping_address
      target: shipping_address
    - direction: input
      source: email
      target: email

  execution:
    mode: wait
    timeout: 5s
