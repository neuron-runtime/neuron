apiVersion: neuron/v1
kind: Capability

metadata:
  name: send-confirmation
  version: 1.0.0
  description: Send confirmation email

spec:
  capability runtime:
    type: neuron:core:set
    runtimeConfig:
      execution:
        mode: wait
        timeout: 5s

  config:
    confirmation_sent: true
    message_id: msg_xyz789

  mappings:
    - direction: input
      source: tracking_number
      target: tracking_number
    - direction: input
      source: carrier
      target: carrier
    - direction: input
      source: email
      target: email

    # Declared outputs: the assembly's result contract maps these ports, and
    # `neuron:core:set` echoes them back from the capability's params and
    # config.
    - direction: output
      source: tracking_number
      target: tracking_number
    - direction: output
      source: carrier
      target: carrier
    - direction: output
      source: email
      target: email
    - direction: output
      source: grand_total
      target: grand_total
    - direction: output
      source: confirmation_sent
      target: confirmation_sent
    - direction: output
      source: message_id
      target: message_id
