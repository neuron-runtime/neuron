apiVersion: neuron/v1
kind: Capability

metadata:
  name: send-confirmation
  version: 1.0.0
  description: Send confirmation email

spec:
  capability runtime:
    type: neuron:core:set
    runtimeConfig:
      execution:
        mode: wait
        timeout: 5s

  config:
    confirmation_sent: true
    message_id: msg_xyz789

  mappings:
    - direction: input
      source: tracking_number
      target: tracking_number
    - direction: input
      source: carrier
      target: carrier
    - direction: input
      source: email
      target: email
