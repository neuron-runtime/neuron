apiVersion: neuron/v1
kind: Capability

metadata:
  name: enrich-customer
  version: 1.0.0
  description: Enrich with customer data

spec:
  capability runtime:
    type: neuron:core:set

  config:
    customer_data:
      tier: gold
      email: customer@example.com
      shipping_address:
        state: CA
        city: San Francisco
        zip: 94102

  mappings:
    - direction: input
      source: customer_id
      target: customer_id

  execution:
    mode: wait
    timeout: 5s
