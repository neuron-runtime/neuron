name: order-processing
version: "1.0.0"
lang: yaml
assemblies:
  - name: order-processing
    entry: assemblies/order-processing/assembly.yaml
    default: true

variables:
  environment: development
  api:
    base_url: https://api.example.com
    timeout: 10s

runtime:
  execution:
    mode: wait
    timeout: 120s
  workers:
    min: 2
    max: 8

inspector:
  enabled: true
  address: 127.0.0.1:7433